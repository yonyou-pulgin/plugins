<!doctype html><html lang="en"><head><meta charset="UTF-8"/><link rel="icon" href="/favicon.ico"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>签字确认</title><script src="https://tam.cdn-go.cn/aegis-sdk/latest/aegis.f.min.js"></script></head><body><div id="app"></div></body><script>const assets = {
      scripts: [
        'https://www.yygongzi.com/plugin/chunk-vendors.js',
        'https://www.yygongzi.com/plugin/app.js'
      ],
      styles: [
        'https://www.yygongzi.com/plugin/app.css'
      ]
    };

    // 加载CSS
    assets.styles.forEach(url => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = url + `?version=${Math.random()}`;
      document.head.appendChild(link);
    });

    // 加载JS
    assets.scripts.forEach(url => {
      const script = document.createElement('script');
      script.defer = true;
      script.src =  url + `?version=${Math.random()}`;
      document.head.appendChild(script);
    });</script></html>
